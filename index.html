<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Burado Thumbnail</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="static/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/css/awesomplete.css" rel="stylesheet">
  <link href="static/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container-xxl py-2">

    <header class="d-flex align-items-center gap-2 mb-2">
      <h1 class="h5 mb-0 fw-bold">Burado Thumbnail Maker</h1>
      <a href="https://github.com/Fiend3d/burado" class="link-secondary d-inline-flex" title="Fiend3d/burado">
        <img src="static/github.png" width="20" height="20" alt="GitHub">
      </a>
      <a href="https://github.com/GSonicZ/burado" class="link-secondary d-inline-flex" title="GSonicZ/burado">
        <img src="static/github.png" width="20" height="20" alt="GitHub">
      </a>
      <span class="small text-muted d-none d-md-inline">Paste screenshots &rarr; adjust &rarr; profit</span>
      <div class="btn-group btn-group-sm ms-auto" role="group" aria-label="Mode">
        <input type="radio" class="btn-check" name="mode" id="mode_abyss" value="abyss" autocomplete="off" checked>
        <label class="btn btn-outline-primary" for="mode_abyss">Abyss</label>
        <input type="radio" class="btn-check" name="mode" id="mode_stygian" value="stygian" autocomplete="off">
        <label class="btn btn-outline-primary" for="mode_stygian">Stygian</label>
      </div>
    </header>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="canvas-holder sticky-lg-top">
          <canvas id="thumbnail" width="1280" height="720" class="w-100 rounded border"></canvas>
        </div>
      </div>

      <div class="col-lg-5">

        <!-- Label card (original distance/shift controls) -->
        <div class="card mb-2">
          <div class="card-header py-1 px-2 small fw-semibold">Label</div>
          <div class="card-body p-2">
            <div class="row g-2">
              <div class="col-6">
                <label for="abyss_label_first" class="form-label small mb-1">First line</label>
                <input id="abyss_label_first" class="form-control form-control-sm" type="text" value="Abyss">
              </div>
              <div class="col-6">
                <label for="abyss_label_second" class="form-label small mb-1">Second line</label>
                <input id="abyss_label_second" class="form-control form-control-sm" type="text" value="X.X">
              </div>
              <div class="col-12" data-mode="stygian">
                <div class="row g-2 mt-0">
                  <div class="col-auto">
                    <label class="form-label small mb-1">Fill</label>
                    <input type="color" class="form-control form-control-color form-control-sm" id="sty_fill_color" value="#ffffff">
                  </div>
                  <div class="col-auto">
                    <label class="form-label small mb-1">Border</label>
                    <input type="color" class="form-control form-control-color form-control-sm" id="sty_border_color" value="#000000">
                  </div>
                  <div class="col">
                    <div class="d-flex justify-content-between">
                      <label for="sty_border_width" class="form-label small mb-1">Border Width</label>
                      <output id="sty_border_width_value" class="small text-muted"></output>
                    </div>
                    <input type="range" class="form-range" id="sty_border_width" min="0" max="60" step="1" value="15">
                  </div>
                </div>
              </div>
              <div class="col-12" data-mode="stygian">
                <div class="d-flex justify-content-between">
                  <label for="abyss_label_distance" class="form-label small mb-1">Distance</label>
                  <output for="abyss_label_distance" id="abyss_label_distance_value" class="small text-muted"></output>
                </div>
                <input type="range" class="form-range" id="abyss_label_distance" min="0" max="100" step="1" value="60">
              </div>
              <div class="col-12" data-mode="stygian">
                <div class="d-flex justify-content-between">
                  <label for="label_shift" class="form-label small mb-1">Shift</label>
                  <output for="label_shift" id="label_shift_value" class="small text-muted"></output>
                </div>
                <input type="range" class="form-range" id="label_shift" min="-250" max="250" step="1" value="0">
              </div>
            </div>
          </div>
        </div>

        <!-- Custom controls (abyss only) -->
        <div id="abyss_custom_controls" class="card mb-2">
          <div class="card-header py-1 px-2 small fw-semibold">Text &amp; Icon Controls</div>
          <div class="card-body p-2">

            <!-- Shared colors -->
            <div class="row g-2 mb-2">
              <div class="col-auto">
                <label class="form-label small mb-1">Fill</label>
                <input type="color" class="form-control form-control-color form-control-sm" id="abyss_fill_color" value="#ffffff">
              </div>
              <div class="col-auto">
                <label class="form-label small mb-1">Border</label>
                <input type="color" class="form-control form-control-color form-control-sm" id="abyss_border_color" value="#000000">
              </div>
              <div class="col">
                <div class="d-flex justify-content-between">
                  <label for="abyss_border_width" class="form-label small mb-1">Border Width</label>
                  <output id="abyss_border_width_value" class="small text-muted"></output>
                </div>
                <input type="range" class="form-range" id="abyss_border_width" min="0" max="60" step="1" value="15">
              </div>
            </div>

            <!-- First line -->
            <div class="card mb-2">
              <div class="card-header py-1 px-2 small">First Line</div>
              <div class="card-body p-2">
                <div class="row g-2 mb-1">
                  <div class="col">
                    <div class="d-flex justify-content-between">
                      <label for="abyss_first_font_size" class="form-label small mb-1">Font Size</label>
                      <output id="abyss_first_font_size_value" class="small text-muted"></output>
                    </div>
                    <input type="range" class="form-range" id="abyss_first_font_size" min="10" max="200" step="1" value="70">
                  </div>
                </div>
                <div class="row g-2">
                  <div class="col">
                    <div class="d-flex justify-content-between">
                      <label for="abyss_first_x" class="form-label small mb-1">X</label>
                      <output id="abyss_first_x_value" class="small text-muted"></output>
                    </div>
                    <input type="range" class="form-range" id="abyss_first_x" min="0" max="1280" step="1" value="640">
                  </div>
                  <div class="col">
                    <div class="d-flex justify-content-between">
                      <label for="abyss_first_y" class="form-label small mb-1">Y</label>
                      <output id="abyss_first_y_value" class="small text-muted"></output>
                    </div>
                    <input type="range" class="form-range" id="abyss_first_y" min="0" max="720" step="1" value="320">
                  </div>
                </div>
              </div>
            </div>

            <!-- Second line -->
            <div class="card mb-2">
              <div class="card-header py-1 px-2 small">Second Line</div>
              <div class="card-body p-2">
                <div class="row g-2 mb-1">
                  <div class="col">
                    <div class="d-flex justify-content-between">
                      <label for="abyss_second_font_size" class="form-label small mb-1">Font Size</label>
                      <output id="abyss_second_font_size_value" class="small text-muted"></output>
                    </div>
                    <input type="range" class="form-range" id="abyss_second_font_size" min="10" max="200" step="1" value="70">
                  </div>
                </div>
                <div class="row g-2">
                  <div class="col">
                    <div class="d-flex justify-content-between">
                      <label for="abyss_second_x" class="form-label small mb-1">X</label>
                      <output id="abyss_second_x_value" class="small text-muted"></output>
                    </div>
                    <input type="range" class="form-range" id="abyss_second_x" min="0" max="1280" step="1" value="640">
                  </div>
                  <div class="col">
                    <div class="d-flex justify-content-between">
                      <label for="abyss_second_y" class="form-label small mb-1">Y</label>
                      <output id="abyss_second_y_value" class="small text-muted"></output>
                    </div>
                    <input type="range" class="form-range" id="abyss_second_y" min="0" max="720" step="1" value="400">
                  </div>
                </div>
              </div>
            </div>

            <!-- Bottom labels -->
            <div class="card mb-2">
              <div class="card-header py-1 px-2 small">Bottom Labels</div>
              <div class="card-body p-2">
                <div class="row g-2 mb-1">
                  <div class="col">
                    <label for="abyss_label_left" class="form-label small mb-1">Left</label>
                    <input id="abyss_label_left" class="form-control form-control-sm" type="text" value="">
                  </div>
                  <div class="col">
                    <label for="abyss_label_right" class="form-label small mb-1">Right</label>
                    <input id="abyss_label_right" class="form-control form-control-sm" type="text" value="">
                  </div>
                </div>
                <div class="d-flex justify-content-between">
                  <label for="bottom_font_size" class="form-label small mb-1">Font Size</label>
                  <output id="bottom_font_size_value" class="small text-muted"></output>
                </div>
                <input type="range" class="form-range" id="bottom_font_size" min="10" max="200" step="1" value="70">
              </div>
            </div>

            <!-- Abyss icon -->
            <div class="card">
              <div class="card-header py-1 px-2 small">Abyss Icon</div>
              <div class="card-body p-2">
                <div class="row g-2">
                  <div class="col">
                    <div class="d-flex justify-content-between">
                      <label for="abyss_icon_x" class="form-label small mb-1">X</label>
                      <output id="abyss_icon_x_value" class="small text-muted"></output>
                    </div>
                    <input type="range" class="form-range" id="abyss_icon_x" min="-640" max="1280" step="1" value="640">
                  </div>
                  <div class="col">
                    <div class="d-flex justify-content-between">
                      <label for="abyss_icon_y" class="form-label small mb-1">Y</label>
                      <output id="abyss_icon_y_value" class="small text-muted"></output>
                    </div>
                    <input type="range" class="form-range" id="abyss_icon_y" min="-360" max="720" step="1" value="360">
                  </div>
                  <div class="col">
                    <div class="d-flex justify-content-between">
                      <label for="abyss_icon_scale" class="form-label small mb-1">Scale %</label>
                      <output id="abyss_icon_scale_value" class="small text-muted"></output>
                    </div>
                    <input type="range" class="form-range" id="abyss_icon_scale" min="10" max="300" step="1" value="100">
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- Background -->
        <div class="card mb-2">
          <div class="card-header py-1 px-2 small fw-semibold">Background</div>
          <div class="card-body p-2">
            <div id="background_panels"></div>
            <div id="background_shifts" class="mt-2"></div>
            <div class="d-flex justify-content-between">
              <label for="background_blend" class="form-label small mb-1">Blend</label>
              <output for="background_blend" id="background_blend_value" class="small text-muted"></output>
            </div>
            <input type="range" class="form-range" id="background_blend" min="0" max="400" step="1" value="100">
          </div>
        </div>

        <!-- Characters -->
        <div class="card mb-2">
          <div class="card-header py-1 px-2 small fw-semibold">Characters</div>
          <div class="card-body p-2" id="character_slots"></div>
        </div>

        <!-- Extra (abyss only) -->
        <div class="card mb-2" data-mode="abyss">
          <div class="card-header py-1 px-2 small fw-semibold">Extra</div>
          <div class="card-body p-2">
            <div class="d-flex flex-wrap gap-3">
              <div class="form-check mb-0">
                <input class="form-check-input" type="checkbox" value="" id="four_star">
                <label class="form-check-label small" for="four_star">4* Only</label>
              </div>
              <div class="form-check mb-0">
                <input class="form-check-input" type="checkbox" value="" id="question">
                <label class="form-check-label small" for="question">Question</label>
              </div>
              <div class="form-check mb-0">
                <input class="form-check-input" type="checkbox" value="" id="epic_fail">
                <label class="form-check-label small" for="epic_fail">Epic Fail</label>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="static/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/awesomplete.min.js"></script>
  <script type="module" src="static/js/script.js"></script>
</body>
</html>
